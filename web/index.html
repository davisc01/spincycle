<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spin Cycle</title>
  <link rel="icon" type="image/png" sizes="128x128" href="/images/spin_cycle_icon_128.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/images/spin_cycle_icon_256.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/images/spin_cycle_icon_512.png">
  <meta name="theme-color" content="#241812">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img class="logo" src="/images/spin_cycle_logo_full.png" alt="Spin Cycle">
    <button id="settings-toggle" type="button" aria-expanded="false">Settings</button>
  </header>

  <main id="remote">
    <button id="cache-warning" type="button" hidden></button>

    <div class="picker-row">
      <div class="dial-picker">
        <span class="dial-caption">Genre</span>
        <div class="dial" id="genre-dial">
          <button type="button" class="dial-step dial-step-prev" aria-label="Previous genre">‹</button>
          <div class="dial-knob"><div class="dial-indicator"></div></div>
          <button type="button" class="dial-step dial-step-next" aria-label="Next genre">›</button>
        </div>
        <div class="dial-readout" id="genre-readout"></div>
        <select id="genre-select" class="dial-select">
          <option value="">-- pick a genre --</option>
        </select>
      </div>
      <div class="dial-picker">
        <span class="dial-caption">Era</span>
        <div class="dial" id="era-dial">
          <button type="button" class="dial-step dial-step-prev" aria-label="Previous era">‹</button>
          <div class="dial-knob"><div class="dial-indicator"></div></div>
          <button type="button" class="dial-step dial-step-next" aria-label="Next era">›</button>
        </div>
        <div class="dial-readout" id="era-readout"></div>
        <select id="era-select" class="dial-select">
          <option value="">-- pick an era --</option>
        </select>
      </div>
    </div>

    <p id="status-message">Loading...</p>

    <div class="transport-row">
      <button id="skip-btn" type="button">Skip</button>
      <button id="stop-btn" type="button">Stop</button>
    </div>
  </main>

  <aside id="settings" hidden>
    <h2>Settings</h2>

    <section>
      <h3>Cache storage location</h3>
      <p>Local path where downloaded videos are cached (e.g. your external drive's mount point).</p>
      <form id="cache-root-form">
        <input type="text" id="cache-root-input" placeholder="/mnt/usbdrive/jukebox_cache" required>
        <button type="submit">Save</button>
      </form>
      <p id="cache-root-result"></p>
    </section>

    <section>
      <h3>Library (config/library.csv)</h3>
      <p id="library-status"></p>
      <a id="download-link" href="/library.csv" download="library.csv">Download current library.csv</a>
      <form id="upload-form" method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="csv" accept=".csv" required>
        <button type="submit">Upload replacement</button>
      </form>
      <p id="upload-result"></p>
    </section>

    <section>
      <h3>Cache warming</h3>
      <p id="warm-status">Idle</p>
      <button id="warm-cache-btn" type="button">Warm cache</button>
    </section>

    <section>
      <h3>Cache log</h3>
      <pre id="cache-log" class="log-pane"></pre>
    </section>

    <section>
      <h3>Playback log</h3>
      <pre id="playback-log" class="log-pane"></pre>
    </section>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
