<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spin Cycle Player</title>
  <link rel="icon" type="image/png" sizes="128x128" href="/images/spin_cycle_icon_128.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #v {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.75rem 1rem;
      font: 14px system-ui, -apple-system, sans-serif;
      color: #39ff8a;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      pointer-events: none;
    }
    #tap-to-play {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border: none;
      background: rgba(0, 0, 0, 0.6);
      color: #39ff8a;
      font: 600 20px system-ui, -apple-system, sans-serif;
      cursor: pointer;
    }
    #tap-to-play.shown {
      display: flex;
    }
    #tap-to-play span {
      padding: 1rem 1.5rem;
      border: 1px solid #39ff8a;
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.5);
    }
    #track-overlay {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      max-width: 60%;
      font: 600 16px system-ui, -apple-system, sans-serif;
      color: #39ff8a;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      line-height: 1.4;
      white-space: pre-line;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #track-overlay.shown {
      opacity: 1;
    }
  </style>
</head>
<body>
  <video id="v" playsinline controls></video>
  <button id="tap-to-play" type="button"><span>&#9654; Click to start playback</span></button>
  <div id="overlay"></div>
  <div id="track-overlay"></div>
  <script src="/player.js"></script>
</body>
</html>
