name: Build and push Spin Cycle (k3s/web target)

# Same app/Dockerfile image used by every deploy target -- this workflow
# just publishes it to GHCR for the k3s deployment (see deploy/k3s/ and
# ~/git/myhomelab's k8s/base/spincycle/, which pulls ghcr.io/davisc01/
# spincycle:latest with imagePullPolicy: Always). After a push here,
# pick up the new image with:
#   kubectl rollout restart deployment/spincycle -n spincycle
# (matches the myhomelab cluster's existing convention, e.g. cashflow.)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/davisc01/spincycle:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
