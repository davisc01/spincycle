name: Build and push Spin Cycle (container/web target)

# Same app/Dockerfile image used by every deploy target -- this workflow
# just publishes it to GHCR for the container deployment (see
# deploy/container/). After a push here, pick up the new image with
# whatever your deployment uses to re-pull, e.g.:
#   kubectl rollout restart deployment/spincycle
# or `docker compose pull && docker compose up -d` / a Portainer webhook /
# a `podman pull && systemctl restart` -- see deploy/container/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/davisc01/spincycle:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
