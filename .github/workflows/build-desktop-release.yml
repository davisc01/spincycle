name: Build and release Spin Cycle (Windows/macOS desktop apps)

# Manual only: builds deploy/windows/ and deploy/macos/ at the given git
# tag and publishes the Windows installer, the macOS DMG, and the sample
# My_Video_List.csv library as assets on that tag's GitHub Release
# (created if it doesn't exist yet). Re-run against an already-released
# tag to rebuild and replace all assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (e.g. v2.3)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # winget, not choco: Chocolatey auto-shims every .exe in a package's
      # tools folder, so `Get-Command ffmpeg` resolves to a tiny proxy
      # executable in C:\ProgramData\chocolatey\bin that redirects to the
      # real binary at its original absolute path on *this* machine -- copying
      # that shim into the installer (see build.ps1 below) produces an
      # ffmpeg.exe that only works here, not on an end user's PC. winget
      # installs the real static Gyan.FFmpeg build directly, matching what
      # build.ps1's own comments and CLAUDE.md already assume.
      #
      # winget installs into a per-package folder under
      # %LOCALAPPDATA%\Microsoft\WinGet\Packages and only makes that
      # directory visible on PATH via a registry change that needs a new
      # shell to pick up ("Path environment variable modified; restart
      # your shell to use the new value" -- winget's own install output)
      # -- unlike Chocolatey's shim folder, which is already on PATH by
      # default on these runners, so nothing needed refreshing before.
      # A later GitHub Actions step is a fresh process that doesn't see
      # that registry change either, so explicitly find wherever winget
      # put ffmpeg.exe and append it to $GITHUB_PATH (the supported way
      # to extend PATH for every later step in this job) rather than
      # relying on Get-Command finding it for free next.
      - name: Install ffmpeg
        run: |
          winget install --id Gyan.FFmpeg -e --source winget --accept-package-agreements --accept-source-agreements
          $ffmpegBin = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpegBin) {
              throw "winget installed Gyan.FFmpeg but ffmpeg.exe wasn't found under $env:LOCALAPPDATA\Microsoft\WinGet\Packages"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegBin.DirectoryName

      - name: Build Spin Cycle.exe
        shell: pwsh
        run: |
          cd deploy\windows
          .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: deploy/windows/dist/Spin Cycle-Windows-Setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install create-dmg, ffmpeg, dylibbundler
        run: brew install create-dmg ffmpeg dylibbundler

      - name: Build Spin Cycle.app and DMG
        working-directory: deploy/macos
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: deploy/macos/dist/Spin Cycle-macos.dmg
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/Spin Cycle-Windows-Setup.exe
            artifacts/Spin Cycle-macos.dmg
            My_Video_List.csv
