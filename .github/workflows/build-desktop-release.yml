name: Build and release Spin Cycle (Windows/macOS desktop apps)

# Manual only: builds deploy/windows/ and deploy/macos/ at the given git
# tag and publishes the Windows installer + portable zip and the macOS
# DMG as assets on that tag's GitHub Release (created if it doesn't exist
# yet). Re-run against an already-released tag to rebuild and replace all
# three assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (e.g. v2.3)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build Spin Cycle.exe
        shell: pwsh
        run: |
          cd deploy\windows
          .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            deploy/windows/dist/Spin Cycle-windows.zip
            deploy/windows/dist/Spin Cycle-Setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Spin Cycle.app and DMG
        working-directory: deploy/macos
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: deploy/macos/dist/Spin Cycle-macos.dmg
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/Spin Cycle-windows.zip
            artifacts/Spin Cycle-Setup.exe
            artifacts/Spin Cycle-macos.dmg
